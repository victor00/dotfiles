"$schema" = "https://starship.rs/config-schema.json"

command_timeout = 1000
scan_timeout = 30
add_newline = true
palette = "catppuccin_mocha"

format = """
${custom.system_context}\
$directory\
$git_branch\
$git_status\
$ruby\
$golang\
$python\
$java\
$nodejs\
$docker_context\
$kubernetes\
${custom.helm}\
$terraform\
$fill\
$cmd_duration\
$jobs\
$status\
$time\
$line_break\
$character"""

[custom.system_context]
command = "printf '%s@%s' \"$(id -un)\" \"$(hostname -s)\""
when = "[ -n \"${SSH_CONNECTION:-}${SSH_TTY:-}\" ] || [ \"$(id -u)\" -eq 0 ]"
shell = ["bash", "--noprofile", "--norc"]
symbol = "󰣇"
format = "[$symbol $output]($style) "
style = "bold peach"

[directory]
truncation_length = 4
truncate_to_repo = true
read_only = " 󰌾"
style = "bold blue"

[git_branch]
symbol = "git:"
format = "[$symbol$branch(:$remote_branch)]($style) "
style = "bold mauve"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold lavender"
ahead = "enviar:${count} "
behind = "receber:${count} "
diverged = "divergiu:enviar-${ahead_count}/receber-${behind_count} "
modified = "modificados:${count} "
staged = "preparados:${count} "
untracked = "novos:${count} "
deleted = "removidos:${count} "
renamed = "renomeados:${count} "
conflicted = "conflitos:${count} "
stashed = "stashes:${count} "

[ruby]
symbol = "ruby:"
format = "[$symbol($version)]($style) "
style = "bold red"

[golang]
symbol = "go:"
format = "[$symbol($version)]($style) "
style = "bold sapphire"

[python]
symbol = "python:"
format = '[$symbol($version)( \($virtualenv\))]($style) '
style = "bold yellow"

[java]
symbol = "java:"
format = "[$symbol($version)]($style) "
style = "bold peach"

[nodejs]
symbol = "node:"
format = "[$symbol($version)]($style) "
style = "bold green"

[docker_context]
symbol = "docker:"
format = "[$symbol$context]($style) "
style = "bold sapphire"
detect_files = [
  "Dockerfile",
  "compose.yaml",
  "compose.yml",
  "docker-compose.yaml",
  "docker-compose.yml",
]
detect_folders = [".docker"]

[kubernetes]
disabled = false
symbol = "kube:"
format = "[$symbol$context(::$namespace)]($style) "
style = "bold mauve"
detect_files = ["kustomization.yaml", "skaffold.yaml"]
detect_folders = [".kube", "k8s", "kubernetes"]
detect_env_vars = ["KUBECONFIG"]

[custom.helm]
command = "helm version --short | cut -d+ -f1"
detect_files = ["Chart.yaml", "helmfile.yaml", "helmfile.yml"]
detect_folders = ["charts", "helm"]
shell = ["bash", "--noprofile", "--norc"]
symbol = "helm:"
format = "[$symbol$output]($style) "
style = "bold lavender"

[terraform]
symbol = "terraform:"
format = "[$symbol$workspace]($style) "
style = "bold mauve"

[fill]
symbol = " "

[cmd_duration]
min_time = 1500
show_milliseconds = false
format = "[tempo:$duration]($style) "
style = "bold peach"

[jobs]
symbol = "jobs:"
number_threshold = 1
format = "[$symbol$number]($style) "
style = "bold yellow"

[status]
disabled = false
map_symbol = false
pipestatus = true
format = "[erro:$status]($style) "
style = "bold red"

[time]
disabled = false
time_format = "%H:%M"
format = "[$time]($style)"
style = "overlay1"

[character]
success_symbol = "[❯](bold blue)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold mauve)"

[package]
disabled = true

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
