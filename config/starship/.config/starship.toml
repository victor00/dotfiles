"$schema" = "https://starship.rs/config-schema.json"

command_timeout = 1000
scan_timeout = 30
add_newline = true
palette = "operator"

format = """
${custom.system_context}\
$directory\
$git_branch\
$git_status\
$ruby\
$golang\
$python\
$java\
$nodejs\
$docker_context\
$kubernetes\
${custom.helm}\
$terraform\
$fill\
$cmd_duration\
$jobs\
$status\
$time\
$line_break\
$character"""

[custom.system_context]
command = "printf '%s@%s' \"$(id -un)\" \"$(hostname -s)\""
when = "[ -n \"${SSH_CONNECTION:-}${SSH_TTY:-}\" ] || [ \"$(id -u)\" -eq 0 ]"
shell = ["bash", "--noprofile", "--norc"]
symbol = "󰣇"
format = "[$symbol $output]($style) "
style = "bold peach"

[directory]
truncation_length = 4
truncate_to_repo = true
read_only = " 󰌾"
style = "bold blue"

[git_branch]
symbol = "git:"
format = "[$symbol$branch(:$remote_branch)]($style) "
style = "bold peach"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold lavender"
ahead = "enviar:${count} "
behind = "receber:${count} "
diverged = "divergiu:enviar-${ahead_count}/receber-${behind_count} "
modified = "modificados:${count} "
staged = "preparados:${count} "
untracked = "novos:${count} "
deleted = "removidos:${count} "
renamed = "renomeados:${count} "
conflicted = "conflitos:${count} "
stashed = "stashes:${count} "

[ruby]
symbol = "ruby:"
format = "[$symbol($version)]($style) "
style = "bold peach"

[golang]
symbol = "go:"
format = "[$symbol($version)]($style) "
style = "bold sapphire"

[python]
symbol = "python:"
format = '[$symbol($version)( \($virtualenv\))]($style) '
style = "bold yellow"

[java]
symbol = "java:"
format = "[$symbol($version)]($style) "
style = "bold peach"

[nodejs]
symbol = "node:"
format = "[$symbol($version)]($style) "
style = "bold green"

[docker_context]
symbol = "docker:"
format = "[$symbol$context]($style) "
style = "bold sapphire"
detect_files = [
  "Dockerfile",
  "compose.yaml",
  "compose.yml",
  "docker-compose.yaml",
  "docker-compose.yml",
]
detect_folders = [".docker"]

[kubernetes]
disabled = false
symbol = "kube:"
format = "[$symbol$context(::$namespace)]($style) "
style = "bold mauve"
detect_files = ["kustomization.yaml", "skaffold.yaml"]
detect_folders = [".kube", "k8s", "kubernetes"]
detect_env_vars = ["KUBECONFIG"]

[custom.helm]
command = "helm version --short | cut -d+ -f1"
detect_files = ["Chart.yaml", "helmfile.yaml", "helmfile.yml"]
detect_folders = ["charts", "helm"]
shell = ["bash", "--noprofile", "--norc"]
symbol = "helm:"
format = "[$symbol$output]($style) "
style = "bold lavender"

[terraform]
symbol = "terraform:"
format = "[$symbol$workspace]($style) "
style = "bold mauve"

[fill]
symbol = " "

[cmd_duration]
min_time = 1500
show_milliseconds = false
format = "[tempo:$duration]($style) "
style = "bold peach"

[jobs]
symbol = "jobs:"
number_threshold = 1
format = "[$symbol$number]($style) "
style = "bold yellow"

[status]
disabled = false
map_symbol = false
pipestatus = true
format = "[erro:$status]($style) "
style = "bold red"

[time]
disabled = false
time_format = "%H:%M"
format = "[$time]($style)"
style = "bold overlay1"

[character]
success_symbol = "[❯](bold blue)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold mauve)"

[package]
disabled = true

[palettes.operator]
rosewater = "#FFB000"
flamingo = "#FF8C00"
pink = "#FF8C00"
mauve = "#C678DD"
red = "#E06C75"
maroon = "#BE5046"
peach = "#FF8C00"
yellow = "#FFB000"
green = "#98C379"
teal = "#56B6C2"
sky = "#56B6C2"
sapphire = "#4B8FCC"
blue = "#4B8FCC"
lavender = "#7AA2F7"
text = "#ABB2BF"
subtext1 = "#9DA5B4"
subtext0 = "#828997"
overlay2 = "#7F848E"
overlay1 = "#6B717D"
overlay0 = "#5C6370"
surface2 = "#4B5263"
surface1 = "#3E4451"
surface0 = "#353B45"
base = "#282C34"
mantle = "#21252B"
crust = "#181A1F"
