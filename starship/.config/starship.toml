[username]
style_user = "green bold"
style_root = "red bold"
format = "[$user]($style)"
show_always = false

[hostname]
format = "<[$hostname]($style)>"
trim_at = "-"
style = "bold dimmed white"
disabled = true

[character]
success_symbol = "[➜](bold green) "
error_symbol = "[✗](bold red) "

[directory]
format = "[$path]($style)[$lock_symbol]($lock_style) "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '

# Keep legacy installs readable without requiring icon knowledge.
[git_branch]
symbol = "git:"

[git_status]
conflicted = "conflitos:${count} "
ahead = "enviar:${count} "
behind = "receber:${count} "
diverged = "divergiu:enviar-${ahead_count}/receber-${behind_count} "
untracked = "novos:${count} "
stashed = "stashes:${count} "
modified = "modificados:${count} "
staged = "preparados:${count} "
renamed = "renomeados:${count} "
deleted = "removidos:${count} "
style = "bright-white"
format = "$all_status$ahead_behind"

[package]
disabled = true

[ruby]
symbol = "ruby:"

[java]
symbol = "java:"

[lua]
symbol = " "
